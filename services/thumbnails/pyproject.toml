[project]
name = "thumbnails"
version = "0.1.0"
description = "Photo App thumbnail Lambda: generates thumbs and previews from uploaded originals (spec §10)"
requires-python = ">=3.13,<3.14"
dependencies = [
    "pillow>=13.0.0",
    "pillow-heif>=1.8.1",
]

[dependency-groups]
dev = [
    "boto3>=1.43.114",
    "moto[dynamodb,s3]>=5.2.4",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
